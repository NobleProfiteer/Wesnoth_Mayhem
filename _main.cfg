#ifdef MULTIPLAYER

[modification]
    id=wesnoth_mayhem
    name="Wesnoth Mayhem"
    description="Recieve random augments at the beginning-ish of each scenario, create crazy armies or units, but beware! The enemies are also augment!"
    type=mp

    [event]
        name=start

        [lua]
            code=<<
                local mayhem = wesnoth.require(
                    "~add-ons/Wesnoth_Mayhem/lua/main.lua"
                )

                mayhem.on_start()
            >>
        [/lua]
    [/event]



[/modification]

#endif